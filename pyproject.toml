[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xtract"
version = "0.1.0"
description = "Open-source document intake, OCR, and metadata extraction platform"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Rei Doda" }
]
keywords = ["ocr", "document-processing", "metadata-extraction", "tesseract", "backoffice"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "jsonschema>=4.23.0,<5.0.0",
    "pillow>=10.4.0,<13.0.0",
    "pypdfium2>=4.30.0,<6.0.0",
    "pytesseract>=0.3.13,<0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.16.9,<1.0.0",
    "pip-audit>=2.7.0",
]

[project.scripts]
xtract = "xtract.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xtract = ["contracts/**/*.json", "defaults/*.json", "presets/*/*.json", "resources/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E402", "E501"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
